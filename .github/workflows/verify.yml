# Verification for the Zig package in this repository.
#
# **No run of this workflow has produced a receipt for this package.** It is
# defined here and nothing has been observed from it: not one job below has been
# executed, so its existence is not evidence about Mbed TLS, about this build
# graph, or about any target in its matrix. Every result this repository would
# report belongs to the driver and is recorded in `README.md` and
# `FORK-NOTES.md`, never here.
#
# **Upstream's own CI is NOT reused.** The release tarball carries no CI at all —
# upstream's testing lives in a separate `mbedtls-test` repository
# (`README.upstream.md:257` points at it for Docker images), and `framework/`,
# which would hold its scripts, is deliberately not vendored here. So there is no
# upstream workflow in this tree to retarget, and nothing below borrows another
# maintainer's infrastructure. This file is entirely the fork's and it gates the
# artifacts this fork delivers.
#
# Four jobs, four different questions:
#   provenance  do the 336 vendored bytes, the exact native file set, the
#               preserved upstream README and Mbed TLS's own dual-grant
#               statement still hold — and, for the one step of the fork's own
#               script that cannot yet succeed, does it fail exactly where
#               `UPSTREAM.md` says it does
#   native      does the whole 113-unit closure compile and link in both
#               linkages, do the tests and the example run, does the *installed*
#               tree serve a plain C consumer through its headers and its
#               `mbedtls.pc`, and does the shared delivery carry upstream's own
#               ABI sonames
#   cross       does the whole package compile for each of the six compile
#               targets, without running any of them
#   consumer    does the published module resolve from a package that did not
#               write it, in both linkages
#
# The two linkages share one `native` job rather than being two jobs. The C gate
# program below is written once into `$RUNNER_TEMP` and used against both
# deliveries, which is only possible in one job — and sharing it is what makes
# the comparison meaningful: the same program has to link against
# `libmbedcrypto.a` and against the shared objects, so a difference between the
# two artifacts cannot hide.
#
# Every answer that program checks is a **published standard value** or an
# **independently measured fact about upstream's own fixture** — never a value
# this build computed and accepted back. SHA-256 of `"abc"` against FIPS 180-4
# Appendix B, HMAC-SHA-256 against RFC 4231 §4.2 case 1, AES-128-CBC against
# NIST SP 800-38A §F.2.1, AES-128-GCM against the GCM specification's Test Case
# 2, ChaCha20-Poly1305 against RFC 8439 §2.8.2, and an X.509 chain that verifies
# against upstream's own published `test-ca.crt` and nothing else.
#
# There is no `continue-on-error` in this file and there is no matrix with a
# tolerated target. Each target is a separate step on purpose: a matrix row
# allowed to fail is indistinguishable from a target that was quietly dropped,
# and "we know that one is broken" is only a fact once a run has printed the
# failure. `wasm32-wasi` in particular is **not** refused by `build.zig` —
# `refused_check_targets` is empty and `refusalFor` returns `null` for every OS
# — so its step is a plain compile that either works or prints a failure to
# diagnose. The boundary that platform imposes is expressed where it belongs:
# `zig/config_gen.zig` turns `MBEDTLS_NET_C` off, so the `mbedtls_net_*`
# transport has no symbols and the three loopback tests report `SkipZigTest`
# rather than failing. If a target ever turns out to be unsupported here, the
# honest edit is to replace that step with a command that asserts the specific
# documented failure and to record the run in `FORK-NOTES.md`, not to add a flag
# that hides it.
#
# The runtime-loading route is **not** in this file, and the omission is stated
# rather than faked. `-Druntime=true` needs a provider: a shared object exporting
# the `mbedtls_*` and `psa_*` declarations of `zig/translate.h`, named
# explicitly. A runner could build one and pass it, but the route's coverage is
# already owed by `smoke.zig` and `consumer/src/main.zig`, which both load
# explicitly, and `tests.zig` does not load at all
# (`FORK-NOTES.md` §11). Adding a half-wired loaded job here would read as
# coverage of a configuration this file cannot fully exercise.
#
# System-library mode is deliberately not a step: `-fsys=mbedtls` /
# `-Dsystem=true` **panics at configure time** in this package
# (`build.zig:1159-1167`), because Mbed TLS's struct layouts are compile-time
# constants read out of the configuration header and a system library built with
# a different configuration has different structs under the same names. That
# refusal is a designed outcome, not a missing gate.
#
# The full 53-platform matrix is not in this file. `cross-test`, run from the
# package root, builds and *runs* `tests.zig` for every platform in Zig 0.16.0's
# published Tier 1/2 table through this repository's own build graph, using
# `cross-test.profile.sh` for its settings. It is not a job here because
# `cross-test` and its sibling helpers are a host-local tool with its own runner
# detection and its own scratch policy, not something a GitHub runner has;
# adding a job that invoked a path it does not have would fail for a reason that
# has nothing to do with this package, and wrapping that job in an availability
# check would turn a missing gate into a green one. So this file does not
# pretend to cover it and does not stand in for it: the `cross` jobs below run
# nothing, and a platform with no runner on the host is recorded as explicit
# `build_only` coverage, never as a pass. The command and its receipts belong
# in `README.md` and `FORK-NOTES.md`.
#
# Build concurrency here is deliberately modest. Each target graph compiles the
# whole 113-unit closure and several of those units — `ecp_curves.c`,
# `ssl_tls.c`, `psa_crypto.c`, `ssl_msg.c` — are among the largest C files in the
# tree. Four jobs matches `CROSS_BUILD_JOBS` in `cross-test.profile.sh`, so the
# CI figure and the matrix figure are the same fact rather than two guesses.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. The bytes. This job compiles nothing and is the cheapest one to read:
  #    if it fails, nothing downstream is meaningful.
  # ---------------------------------------------------------------------------
  provenance:
    name: provenance, licence grant and native file set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The 336 recorded digests, the exact native file set, Mbed TLS's own
      # dual grant and the bundled Apache-2.0-only material. Mbed TLS is NOT a
      # single licence -- the core is `Apache-2.0 OR GPL-2.0-or-later` and the
      # bundled Everest subtree is Apache-2.0 only with no GPL alternative -- so
      # this notice check is the only way a dropped attribution would be caught
      # before it ships.
      #
      # KNOWN, AND NOT A PASS: `tools/check-provenance.sh` step 3a **cannot
      # succeed** against the current records. It takes
      # `grep -m1 -oE '^[0-9a-f]{64}'` of each file and requires them equal, but
      # `UPSTREAM.md` records the release digest in a table row rather than as a
      # bare 64-digit line, so the grep finds nothing and `set -e` ends the
      # script there. `UPSTREAM.md` "Import mechanism" records this and says the
      # reconciliation is the integrity-script owner's change;
      # `FORK-NOTES.md` section 13.1 restates it. So the script's own step is
      # run **expecting** exactly that documented failure, and this file does
      # not add `|| true`: a tolerated check is not a check. Until the owner
      # reconciles the two records, a red run of this step is the *expected*
      # state, and the two steps above and below it are what actually carry the
      # byte-level guarantee.
      #
      # Whether `sha256sum -c` tolerates the manifest's three leading `#`
      # comment lines is likewise a question for a real run, not an assumption:
      # `FORK-NOTES.md` section 13.6.
      - name: the vendored bytes, the exact file set and the dual grant
        run: |
          set -uo pipefail

          # 1. The bytes. --quiet so a pass is one line, not 336.
          sha256sum -c --quiet UPSTREAM.sha256 || {
            echo "an upstream file no longer matches UPSTREAM.sha256" >&2
            exit 1
          }
          echo "every recorded upstream file matches UPSTREAM.sha256"

          # 2. The exact file set. A checksum run cannot see an ADDITION, so
          #    the manifest's own path list is compared against the disk. This
          #    is the check that fails loudly if a file is added, removed or
          #    renamed -- which a checksum run alone would not.
          expected_tree=$(awk '/^[0-9a-f]{64}  / { print $2 }' UPSTREAM.sha256 \
                           | grep -E '^(src|fixtures)/' | LC_ALL=C sort)
          actual_tree=$(find src fixtures -type f | LC_ALL=C sort)
          if [ "$expected_tree" != "$actual_tree" ]; then
            echo "the native file set differs from the recorded one:" >&2
            diff -u <(echo "$expected_tree") <(echo "$actual_tree") >&2 || true
            exit 1
          fi
          echo "the native file set is exactly the recorded one"

          # 3. Mbed TLS's own grant, where the records say it is. The dual
          #    statement is in src/LICENSE:1-4 and in every core source file's
          #    SPDX tag; the three records must quote it too.
          grep -q 'dual \[Apache-2.0\]' src/LICENSE || {
            echo "the dual Apache-2.0 / GPL-2.0-or-later statement is gone from src/LICENSE" >&2
            exit 1
          }
          # Both full licence texts, in one file. A truncated src/LICENSE would
          # leave a recipient unable to comply.
          test "$(wc -l < src/LICENSE)" -eq 553 || {
            echo "src/LICENSE is $(wc -l < src/LICENSE) lines; both texts need the full 553" >&2
            exit 1
          }
          for file in NOTICE.md README.md FORK-LICENSE.md; do
            grep -q 'Apache-2.0 OR GPL-2.0-or-later' "$file" || {
              echo "the upstream dual-licence identifier is missing from $file" >&2
              exit 1
            }
          done

          # 4. The bundled Apache-2.0-only material must NOT be restated as part
          #    of the dual grant. Everest's own two-line prose notice is the
          #    witness, and the sixteen untagged sources NOTICE.md names must
          #    each still carry it.
          grep -q 'Licensed under the Apache 2.0 License' \
               src/3rdparty/everest/library/Hacl_Curve25519.c || {
            echo "Everest's Apache-2.0 notice is missing from its generated source" >&2
            exit 1
          }
          grep -q 'Copyright (c) INRIA and Microsoft Corporation' NOTICE.md || {
            echo "NOTICE.md does not name the Everest copyright holders" >&2
            exit 1
          }
          tagged=$(grep -rl 'SPDX-License-Identifier: Apache-2.0$' \
                      src/3rdparty/everest/ | wc -l)
          prose=$(grep -rl 'Licensed under the Apache 2.0 License' \
                     src/3rdparty/everest/ | wc -l)
          echo "everest: ${tagged} SPDX-tagged Apache-2.0 files, ${prose} carrying its prose notice"
          test "$tagged" -ge 6 || {
            echo "expected at least 6 tagged Everest sources, found $tagged" >&2
            exit 1
          }
          test "$prose" -ge 16 || {
            echo "expected at least 16 Everest sources with the prose notice, found $prose" >&2
            exit 1
          }

          # 5. The per-file exceptions that make this tree more than one label.
          grep -q 'SPDX-License-Identifier: BSD-3-Clause' \
               src/configs/ext/crypto_config_profile_medium.h || {
            echo "the BSD-3-Clause Arm Limited profile has lost its tag" >&2
            exit 1
          }
          grep -q 'SPDX-License-Identifier: Apache-2.0' \
               src/configs/ext/tfm_mbedcrypto_config_profile_medium.h || {
            echo "the Apache-2.0 ARM Limited profile has lost its tag" >&2
            exit 1
          }

          # 6. The three handshake fixtures are upstream's own published test
          #    data, so their provenance is a matter of record: the names are
          #    fixed and must not be swapped for something this package
          #    generated without a matching NOTICE.md entry.
          for fixture in test-ca.crt server2.crt server2.key; do
            test -f "fixtures/$fixture" || {
              echo "fixtures/$fixture is missing" >&2; exit 1; }
            grep -q "fixtures/$fixture" UPSTREAM.sha256 || {
              echo "fixtures/$fixture is not digested" >&2; exit 1; }
            grep -q "fixtures/$fixture" UPSTREAM.md || {
              echo "fixtures/$fixture has no provenance record in UPSTREAM.md" >&2
              exit 1; }
          done
          echo "the handshake fixtures are recorded and digested"

          # 7. Upstream's own README, byte for byte, under this repository's
          #    naming. It is a digested entry in its own right, and the
          #    repository has no second copy named README.md.
          test -f README.upstream.md || {
            echo "the preserved upstream README is missing" >&2; exit 1; }
          grep -q 'README.upstream.md' build.zig.zon || {
            echo "README.upstream.md is no longer a named package path" >&2
            exit 1; }
          echo "the byte-level provenance checks passed"

      # The fork's own script, with its one known failure asserted rather than
      # tolerated. If it ever gets past step 3a, this step must start failing:
      # that is the signal the owner reconciled the records and the explicit
      # expectation below is stale. Run the byte checks separately above so a
      # red here is unambiguous.
      - name: the provenance script stops exactly where UPSTREAM.md records
        run: |
          set -uo pipefail
          out=$(tools/check-provenance.sh 2>&1)
          status=$?
          printf '%s\n' "$out"

          if [ "$status" -eq 0 ]; then
            echo "UNEXPECTED: tools/check-provenance.sh exited 0." >&2
            echo "Step 3a requires a bare 64-digit line in both records and UPSTREAM.md" >&2
            echo "records the release digest in a table row, so the step cannot succeed" >&2
            echo "yet. If this run says otherwise, the records were reconciled and" >&2
            echo "FORK-NOTES.md section 13.1 and this step are now stale." >&2
            exit 1
          fi

          # The failure must be the documented one and nothing else. These two
          # lines are what a healthy tree prints first; a failure before them is
          # a provenance defect, not the known step-3a gap.
          printf '%s\n' "$out" | grep -q 'every recorded upstream file matches UPSTREAM.sha256' || {
            echo "the script failed BEFORE its byte check: a real provenance defect" >&2
            exit 1; }
          printf '%s\n' "$out" | grep -q 'the native file set is exactly the recorded one' || {
            echo "the script failed before its file-set check: a real provenance defect" >&2
            exit 1; }
          printf '%s\n' "$out" | grep -q 'provenance checks passed' && {
            echo "the script printed its success line but exited non-zero" >&2
            exit 1; }

          echo "as documented, tools/check-provenance.sh reaches step 3a and stops there"

  # ---------------------------------------------------------------------------
  # 2. The native graph: build, tests, smoke, and the installed C surface, in
  #    both linkages against one shared C program.
  # ---------------------------------------------------------------------------
  native:
    name: native build, tests, smoke and installed C surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The gate programs, written once and used against both deliveries. Every
      # expected value below is a literal from a published standard or a field
      # read out of upstream's own fixture with OpenSSL. None is read back out
      # of this build.
      - name: write the C gate program and the crypto vector checker
        run: |
          set -euo pipefail

          # An independent re-derivation of the five vectors, computed with
          # Python's own hashlib/cryptography/hmac rather than with anything in
          # this package. The C program below is compared against THIS output,
          # not against constants transcribed twice into one file.
          python3 - <<'PY' > "$RUNNER_TEMP/expected.txt"
          import hashlib, hmac

          # FIPS 180-4 Appendix B, the single-message digests for "abc".
          for name, fn in (("sha256", hashlib.sha256),
                           ("sha384", hashlib.sha384),
                           ("sha512", hashlib.sha512),
                           ("sha1", hashlib.sha1)):
              print(f"{name}_abc {fn(b'abc').hexdigest()}")

          # RFC 4231 section 4.2 test case 1.
          print("hmac_sha256_case1",
                hmac.new(b"\x0b" * 20, b"Hi There", hashlib.sha256).hexdigest())

          # NIST SP 800-38A F.2.1, CBC-AES128.Encrypt, first block.
          try:
              from cryptography.hazmat.primitives.ciphers import (
                  Cipher, algorithms, modes)
              key = bytes(range(16))
              iv = bytes(range(0x10, 0x20))
              pt = bytes.fromhex("6bc1bee22e409f96e93d7e117393172a")
              enc = Cipher(algorithms.AES(key), modes.CBC(iv)).encryptor()
              print("aes128_cbc_block1", (enc.update(pt) + enc.finalize()).hex())

              # The GCM specification's Test Case 2.
              gkey = b"\x00" * 16
              giv = bytes.fromhex("cafebabefacedbaddecaf888")
              gpt = bytes.fromhex(
                  "d9313225f88406e5a55909c5af5269a"
                  "86a7a9531534f7da2e4c303d8a318a72"
                  "1c3c0c95956809532fcf0e2449a6b525"
                  "b16aedf5aa0de657ba637b39")
              g = Cipher(algorithms.AES(gkey), modes.GCM(giv)).encryptor()
              ct, tag = g.update(gpt) + g.finalize(), g.tag
              print("aes128_gcm_tc2_ciphertext", ct.hex())
              print("aes128_gcm_tc2_tag", tag.hex())
          except ImportError:
              # No `cryptography` module: the AES and GCM rows are skipped and
              # the C program reports them as unverified rather than as passed.
              print("aes128_cbc_block1 SKIP")
              print("aes128_gcm_tc2_ciphertext SKIP")
              print("aes128_gcm_tc2_tag SKIP")
          print("all-vectors-derived")
          PY
          cat "$RUNNER_TEMP/expected.txt"

          # The C program. It reaches only the installed public headers and the
          # three installed libraries: no internal header, no source path, no
          # configuration macro from this package. That is the whole point --
          # it proves the *installed* tree serves a C consumer, which is a
          # different claim from "the archives compile".
          cat > "$RUNNER_TEMP/mbedtls_gate.c" <<'C'
          /* The installed C surface, checked against published values.
             *
             * Every expected answer below is a literal from a published
             * standard (FIPS 180-4 Appendix B, RFC 4231 section 4.2 case 1,
             * NIST SP 800-38A section F.2.1, the GCM specification's Test Case
             * 2, RFC 8439 section 2.8.2) or a field read out of upstream's own
             * published test certificates with a different implementation.
             * Nothing here is read back out of this build.
             *
             * The three files in argv are upstream's own published handshake
             * data: test-ca.crt, server2.crt and server2.key.
             */
          #include <mbedtls/build_info.h>
          #include <mbedtls/aes.h>
          #include <mbedtls/chachapoly.h>
          #include <mbedtls/gcm.h>
          #include <mbedtls/md.h>
          #include <mbedtls/sha256.h>
          #include <mbedtls/version.h>
          #include <mbedtls/x509_crt.h>

          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          static int failures = 0;

          static void hex(const char *what, const unsigned char *got,
                          size_t len, const char *want) {
              char buf[257];
              size_t i;
              for (i = 0; i < len && i < 256; i++)
                  sprintf(buf + 2 * i, "%02x", got[i]);
              buf[2 * len] = '\0';
              printf("%-44s%s\n", what, buf);
              if (want == NULL) {
                  printf("  no independent answer for this row; printed, not compared\n");
                  return;
              }
              if (strcmp(buf, want) != 0) {
                  printf("  MISMATCH: expected %s\n", want);
                  failures++;
              }
          }

          static unsigned char *slurp(const char *path, size_t *len) {
              FILE *f = fopen(path, "rb");
              unsigned char *buf;
              long n;
              if (f == NULL) return NULL;
              fseek(f, 0, SEEK_END);
              n = ftell(f);
              fseek(f, 0, SEEK_SET);
              buf = malloc((size_t)n + 1);
              if (buf == NULL) { fclose(f); return NULL; }
              if (fread(buf, 1, (size_t)n, f) != (size_t)n) {
                  free(buf); fclose(f); return NULL;
              }
              buf[n] = '\0';
              fclose(f);
              *len = (size_t)n;
              return buf;
          }

          /* The environment variable the workflow fills from the independent
             derivation above. Absent means "print, do not compare". */
          static const char *want_for(const char *key) {
              const char *v = getenv(key);
              return (v && v[0] && strcmp(v, "SKIP") != 0) ? v : NULL;
          }

          static int check_hashes(void) {
              unsigned char d[64];
              if (mbedtls_sha256((const unsigned char *)"abc", 3, d, 0) != 0) {
                  printf("mbedtls_sha256 rejected a 3-byte input\n");
                  failures++;
              }
              hex("SHA-256 of abc (FIPS 180-4 B)",
                  d, 32, want_for("WANT_SHA256_ABC"));

              if (mbedtls_sha512((const unsigned char *)"abc", 3, d, 0) != 0) {
                  printf("mbedtls_sha512 rejected a 3-byte input\n");
                  failures++;
              }
              hex("SHA-512 of abc (FIPS 180-4 B)",
                  d, 64, want_for("WANT_SHA512_ABC"));
              return 0;
          }

          static int check_hmac(void) {
              /* The whole HMAC path: md_info_from_type, then md_hmac. A null
                 md_info is reported, never dereferenced. */
              const mbedtls_md_info_t *info =
                  mbedtls_md_info_from_type(MBEDTLS_MD_SHA256);
              unsigned char key[20], tag[32];
              memset(key, 0x0b, sizeof key);
              if (info == NULL) {
                  printf("this build has no SHA-256 md_info; refusing to call md_hmac\n");
                  failures++;
                  return 0;
              }
              if (mbedtls_md_hmac(info, key, sizeof key,
                                  (const unsigned char *)"Hi There", 8,
                                  tag) != 0) {
                  printf("mbedtls_md_hmac returned non-zero for RFC 4231 case 1\n");
                  failures++;
              }
              hex("HMAC-SHA-256 (RFC 4231 case 1)",
                  tag, 32, want_for("WANT_HMAC_SHA256_CASE1"));
              return 0;
          }

          static int check_cbc(void) {
              mbedtls_aes_context ctx;
              unsigned char key[16], iv[16], out[16];
              const unsigned char pt[16] = {
                  0x6b, 0xc1, 0xbe, 0xe2, 0x2e, 0x40, 0x9f, 0x96,
                  0xe9, 0x3d, 0x7e, 0x11, 0x73, 0x93, 0x17, 0x2a };
              int i;
              for (i = 0; i < 16; i++) { key[i] = (unsigned char)i;
                                         iv[i] = (unsigned char)(0x10 + i); }
              mbedtls_aes_init(&ctx);
              if (mbedtls_aes_setkey_enc(&ctx, key, 128) != 0) {
                  printf("mbedtls_aes_setkey_enc refused a 128-bit key\n");
                  failures++;
                  mbedtls_aes_free(&ctx);
                  return 0;
              }
              if (mbedtls_aes_crypt_cbc(&ctx, MBEDTLS_AES_ENCRYPT, 16, iv,
                                        pt, out) != 0) {
                  printf("mbedtls_aes_crypt_cbc returned non-zero\n");
                  failures++;
              }
              mbedtls_aes_free(&ctx);
              hex("AES-128-CBC block 1 (SP 800-38A F.2.1)",
                  out, 16, want_for("WANT_AES128_CBC_BLOCK1"));
              return 0;
          }

          static int check_gcm(void) {
              mbedtls_gcm_context ctx;
              unsigned char key[16], tag[16];
              /* The GCM specification's Test Case 2: 60-byte plaintext, empty
                 AAD, 96-bit IV. */
              const unsigned char iv[12] = {
                  0xca, 0xfe, 0xba, 0xbe, 0xfa, 0xce, 0xdb, 0xad,
                  0xde, 0xca, 0xf8, 0x88 };
              const unsigned char pt[60] = {
                  0xd9,0x31,0x32,0x25,0xf8,0x84,0x06,0xe5,0xa5,0x59,0x09,0xc5,0xaf,0xf5,0x26,0x9a,
                  0x86,0xa7,0xa9,0x53,0x15,0x34,0xf7,0xda,0x2e,0x4c,0x30,0x3d,0x8a,0x31,0x8a,0x72,
                  0x1c,0x3c,0x0c,0x95,0x95,0x68,0x09,0x53,0x2f,0xcf,0x0e,0x24,0x49,0xa6,0xb5,0x25,
                  0x16,0xae,0xdf,0x5a,0xa0,0xde,0x65,0x7b,0xa6,0x37,0xb3,0x39 };
              unsigned char out[60];
              memset(key, 0, sizeof key);
              mbedtls_gcm_init(&ctx);
              if (mbedtls_gcm_setkey(&ctx, MBEDTLS_CIPHER_ID_AES, key, 128) != 0) {
                  printf("mbedtls_gcm_setkey refused a 128-bit AES key\n");
                  failures++;
                  mbedtls_gcm_free(&ctx);
                  return 0;
              }
              if (mbedtls_gcm_crypt_and_tag(&ctx, MBEDTLS_GCM_ENCRYPT,
                                            sizeof pt, iv, sizeof iv,
                                            NULL, 0, pt, out,
                                            sizeof tag, tag) != 0) {
                  printf("mbedtls_gcm_crypt_and_tag returned non-zero\n");
                  failures++;
              }
              mbedtls_gcm_free(&ctx);
              hex("AES-128-GCM TC2 ciphertext",
                  out, sizeof out, want_for("WANT_AES128_GCM_TC2_CT"));
              hex("AES-128-GCM TC2 tag (GCM spec)",
                  tag, 16, want_for("WANT_AES128_GCM_TC2_TAG"));
              return 0;
          }

          static int check_chachapoly(void) {
              mbedtls_chachapoly_context ctx;
              unsigned char key[32], tag[16], out[114];
              const unsigned char nonce[12] = {
                  0x07, 0x00, 0x00, 0x00, 0x40, 0x41, 0x42, 0x43,
                  0x44, 0x45, 0x46, 0x47 };
              const unsigned char aad[12] = {
                  0x50, 0x51, 0x52, 0x53, 0xc0, 0xc1, 0xc2, 0xc3,
                  0xc4, 0xc5, 0xc6, 0xc7 };
              const char *pt =
                  "Ladies and Gentlemen of the class of '99: If I could offer you "
                  "only one tip for the future, sunscreen would be it.";
              size_t ptlen = strlen(pt);
              int i;
              for (i = 0; i < 32; i++) key[i] = (unsigned char)(0x80 + i);
              mbedtls_chachapoly_init(&ctx);
              if (mbedtls_chachapoly_setkey(&ctx, key) != 0) {
                  printf("mbedtls_chachapoly_setkey refused a 32-byte key\n");
                  failures++;
                  mbedtls_chachapoly_free(&ctx);
                  return 0;
              }
              if (mbedtls_chachapoly_encrypt_and_tag(&ctx, ptlen, nonce, aad,
                                                     sizeof aad,
                                                     (const unsigned char *)pt,
                                                     out, tag) != 0) {
                  printf("mbedtls_chachapoly_encrypt_and_tag returned non-zero\n");
                  failures++;
              }
              mbedtls_chachapoly_free(&ctx);
              hex("ChaCha20-Poly1305 tag (RFC 8439 2.8.2)",
                  tag, 16, want_for("WANT_CHACHA_TAG"));
              return 0;
          }

          static int check_x509(const char *ca_path, const char *crt_path) {
              mbedtls_x509_crt ca, leaf;
              unsigned char *ca_pem, *crt_pem;
              size_t ca_len = 0, crt_len = 0;
              uint32_t flags = 0xFFFFFFFFu;
              char dn[256];
              int ret;

              ca_pem = slurp(ca_path, &ca_len);
              crt_pem = slurp(crt_path, &crt_len);
              if (ca_pem == NULL || crt_pem == NULL) {
                  printf("could not read the fixture certificates\n");
                  free(ca_pem); free(crt_pem);
                  failures++;
                  return 1;
              }

              mbedtls_x509_crt_init(&ca);
              mbedtls_x509_crt_init(&leaf);
              if (mbedtls_x509_crt_parse(&ca, ca_pem, ca_len + 1) != 0) {
                  printf("the test CA did not parse\n"); failures++;
              }
              if (mbedtls_x509_crt_parse(&leaf, crt_pem, crt_len + 1) != 0) {
                  printf("the server certificate did not parse\n"); failures++;
              }

              /* Fields read out of the fixture's own DER with OpenSSL, not out
                 of this build. */
              mbedtls_x509_dn_gets(dn, sizeof dn, &leaf.subject);
              printf("%-44s%s\n", "server2.crt subject", dn);
              if (strcmp(dn, "C=NL, O=PolarSSL, CN=localhost") != 0) {
                  printf("  MISMATCH: the fixture's subject is not the published one\n");
                  failures++;
              }
              mbedtls_x509_dn_gets(dn, sizeof dn, &ca.subject);
              printf("%-44s%s\n", "test-ca.crt subject", dn);
              if (strcmp(dn, "C=NL, O=PolarSSL, CN=PolarSSL Test CA") != 0) {
                  printf("  MISMATCH: the fixture CA's subject is not the published one\n");
                  failures++;
              }
              if (mbedtls_x509_crt_get_ca_istrue(&leaf) != 0) {
                  printf("server2.crt was reported as a CA\n"); failures++;
              }
              if (mbedtls_x509_crt_get_ca_istrue(&ca) == 0) {
                  printf("test-ca.crt was not reported as a CA\n"); failures++;
              }
              if (leaf.version != 3) {
                  printf("server2.crt version was %d, expected 3\n", leaf.version);
                  failures++;
              }

              /* The trust decision: zero MBEDTLS_X509_BADCERT_* bits against
                 the fixture CA, and NOT_TRUSTED against nothing. */
              if (mbedtls_x509_crt_verify(&leaf, &ca, NULL, NULL, &flags,
                                          NULL, NULL) != 0) {
                  printf("the fixture chain did not verify against its own CA\n");
                  failures++;
              }
              printf("%-44s0x%08x\n", "server2.crt verify flags, want 0", flags);
              if (flags != 0) {
                  printf("  MISMATCH: the chain verified with %s\n",
                         (flags & 0x08) ? "NOT_TRUSTED" : "other flags set");
                  failures++;
              }

              /* A chain with no trust anchor must NOT verify. This is the same
                 call with an empty trust list, so it is the same code path
                 saying no rather than a different one being exercised. */
              {
                  mbedtls_x509_crt empty;
                  uint32_t none = 0;
                  mbedtls_x509_crt_init(&empty);
                  (void) mbedtls_x509_crt_verify(&leaf, &empty, NULL, NULL,
                                                &none, NULL, NULL);
                  printf("%-44s0x%08x\n", "server2.crt flags with no CA", none);
                  if ((none & 0x08) == 0) {
                      printf("  MISMATCH: an untrusted chain reported as trusted\n");
                      failures++;
                  }
                  mbedtls_x509_crt_free(&empty);
              }

              /* Bytes that are definitely not a certificate. */
              {
                  mbedtls_x509_crt junk;
                  unsigned char noise[64];
                  size_t i;
                  for (i = 0; i < sizeof noise; i++) noise[i] = (unsigned char)i;
                  mbedtls_x509_crt_init(&junk);
                  if (mbedtls_x509_crt_parse(&junk, noise, sizeof noise) == 0) {
                      printf("64 bytes of noise parsed as a certificate\n");
                      failures++;
                  }
                  mbedtls_x509_crt_free(&junk);
              }

              /* Freeing a chain from the head is what the upstream contract is:
                 mbedtls_x509_crt_free walks the whole list. */
              mbedtls_x509_crt_free(&ca);
              mbedtls_x509_crt_free(&leaf);
              free(ca_pem);
              free(crt_pem);
              (void) ret;
              return 0;
          }

          static int check_version(void) {
              char full[32];
              /* "Mbed TLS 3.6." -- the ABI *family*. A patch release inside
                 the same LTS line answers this too; a 3.5 or a 4.x does not. */
              mbedtls_version_get_string_full(full);
              printf("%-44s%s\n", "library reports version", full);
              if (strncmp(full, "Mbed TLS 3.6.", 14) != 0) {
                  printf("  MISMATCH: not an Mbed TLS 3.6.x build\n");
                  failures++;
              }
              return 0;
          }

          int main(int argc, char **argv) {
              if (argc != 3) {
                  fprintf(stderr, "usage: %s <test-ca.crt> <server2.crt>\n", argv[0]);
                  return 2;
              }
              check_version();
              check_hashes();
              check_hmac();
              check_cbc();
              check_gcm();
              check_chachapoly();
              check_x509(argv[1], argv[2]);
              if (failures != 0) {
                  printf("%d answer(s) did not match the published value\n", failures);
                  return 1;
              }
              printf("every C answer matched its published value\n");
              return 0;
          }
          C

      # ---------------------------------------------------------------- static
      - name: build, test and smoke, static delivery
        run: |
          set -euo pipefail
          zig build -Dlinkage=static --summary all
          zig build test -Dlinkage=static --summary all
          zig build smoke -Dlinkage=static --summary all

      # The three loopback tests in tests.zig and the handshake in smoke.zig
      # bind fixed, documented ports (39443, 39445, 39501). A runner that
      # already has one of them bound fails loudly with a non-zero exit and no
      # silent retry -- that is `Socket.bindAll`'s recorded behaviour, not a
      # flake to be papered over here.

      - name: install the static delivery
        run: |
          set -euo pipefail
          zig build install -Dlinkage=static \
              --prefix "$RUNNER_TEMP/prefix-static" --summary all

      - name: the installed static tree is the documented layout
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/prefix-static"

          for lib in libmbedcrypto libmbedx509 libmbedtls; do
            test -f "$prefix/lib/$lib.a" || {
              echo "missing $prefix/lib/$lib.a" >&2; ls -l "$prefix/lib" >&2; exit 1; }
          done

          # The headers install into their own subdirectories, because they
          # include each other by those exact names and a flat layout would
          # make `#include "mbedtls/build_info.h"` unresolvable for a consumer.
          for h in build_info.h version.h sha256.h aes.h gcm.h chachapoly.h \
                   md.h x509.h x509_crt.h entropy.h net_sockets.h ssl.h \
                   error.h compat-2.x.h; do
            test -f "$prefix/include/mbedtls/$h" || {
              echo "missing include/mbedtls/$h" >&2; exit 1; }
          done
          for h in crypto.h crypto_extra.h crypto_types.h crypto_values.h \
                   crypto_sizes.h crypto_struct.h crypto_platform.h \
                   crypto_se_driver.h; do
            test -f "$prefix/include/psa/$h" || {
              echo "missing include/psa/$h" >&2; exit 1; }
          done

          # THE configuration header, installed under the name the headers reach
          # it by. A consumer including any Mbed TLS header needs *some* file
          # there, and one describing a different configuration than the linked
          # library is the failure this workspace rules out by name. So this is
          # checked two ways: that it exists, and that it is the GENERATED one --
          # the generated header's own guard is the witness.
          test -f "$prefix/include/mbedtls/mbedtls_config.h" || {
            echo "the configuration header was not installed" >&2; exit 1; }
          grep -q 'MBED_TLS_TARGET_CONFIG_H' "$prefix/include/mbedtls/mbedtls_config.h" || {
            echo "the installed mbedtls_config.h is not the generated header;" >&2
            echo "it should carry the generator's own include guard" >&2
            exit 1; }
          grep -q 'MBEDTLS_CONFIG_FILE' "$prefix/include/mbedtls/mbedtls_config.h" || {
            echo "the installed configuration header has no banner" >&2; exit 1; }

          # pkg-config.
          test -f "$prefix/lib/pkgconfig/mbedtls.pc" || {
            echo "missing mbedtls.pc" >&2; exit 1; }
          grep -q '^Version: 3\.6\.7$' "$prefix/lib/pkgconfig/mbedtls.pc" || {
            echo "mbedtls.pc does not report the pinned version" >&2; exit 1; }
          grep -q '\-lmbedtls \-lmbedx509 \-lmbedcrypto' \
               "$prefix/lib/pkgconfig/mbedtls.pc" || {
            echo "mbedtls.pc does not report upstream's three library names" >&2
            exit 1; }

          # The licence and provenance records. Mbed TLS's grant is dual, so a
          # consumer who ships any of this owes The Mbed TLS Contributors'
          # notice AND the full text -- which is why both texts are in one file
          # and both are installed.
          for record in LICENSE NOTICE.md FORK-LICENSE.md UPSTREAM.md \
                       README.upstream.md; do
            test -f "$prefix/share/licenses/mbed-tls/$record" || {
              echo "missing share/licenses/mbed-tls/$record" >&2; exit 1; }
          done
          grep -q 'dual \[Apache-2.0\]' "$prefix/share/licenses/mbed-tls/LICENSE" || {
            echo "the installed LICENSE is not Mbed TLS's dual grant" >&2; exit 1; }
          grep -q 'Apache-2.0 OR GPL-2.0-or-later' \
               "$prefix/share/licenses/mbed-tls/FORK-LICENSE.md" || {
            echo "the installed FORK-LICENSE does not carry the fork's grant" >&2
            exit 1; }

          # The example is BUILT by the default install step but NOT installed:
          # a demo binary in a consumer's prefix would be a surprise.
          test ! -e "$prefix/bin/mbed-tls-smoke" || {
            echo "the smoke example was installed; it should only be built" >&2
            exit 1; }

          echo "the installed static tree is the documented layout"

      # A plain C consumer, resolved through the installed pkg-config file. The
      # same program runs against both deliveries, so a difference between the
      # archives and the shared objects cannot hide.
      - name: the installed C surface, through pkg-config, static delivery
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/prefix-static"

          # The independent derivation from the earlier step, exported so the
          # program compares against it rather than against constants
          # transcribed into a second file.
          export WANT_SHA256_ABC="$(awk '/^sha256_abc /{print $2}' "$RUNNER_TEMP/expected.txt")"
          export WANT_SHA512_ABC="$(awk '/^sha512_abc /{print $2}' "$RUNNER_TEMP/expected.txt")"
          export WANT_HMAC_SHA256_CASE1="$(awk '/^hmac_sha256_case1 /{print $2}' "$RUNNER_TEMP/expected.txt")"
          export WANT_AES128_CBC_BLOCK1="$(awk '/^aes128_cbc_block1 /{print $2}' "$RUNNER_TEMP/expected.txt")"
          export WANT_AES128_GCM_TC2_CT="$(awk '/^aes128_gcm_tc2_ciphertext /{print $2}' "$RUNNER_TEMP/expected.txt")"
          export WANT_AES128_GCM_TC2_TAG="$(awk '/^aes128_gcm_tc2_tag /{print $2}' "$RUNNER_TEMP/expected.txt")"
          # RFC 8439 2.8.2's tag is a published constant, so it is compared even
          # when the optional `cryptography` module was unavailable above.
          export WANT_CHACHA_TAG=fffd3e18018d93709d02e916121b4bc3

          cc -Wall -Wextra -Werror -O2 \
             -o "$RUNNER_TEMP/gate-static" "$RUNNER_TEMP/mbedtls_gate.c" \
             $(PKG_CONFIG_PATH="$prefix/lib/pkgconfig" pkg-config --cflags mbed-tls) \
             $(PKG_CONFIG_PATH="$prefix/lib/pkgconfig" pkg-config --libs --static mbed-tls)

          "$RUNNER_TEMP/gate-static" fixtures/test-ca.crt fixtures/server2.crt

      # --------------------------------------------------------------- dynamic
      - name: build, test and smoke, shared delivery
        run: |
          set -euo pipefail
          zig build -Dlinkage=dynamic --summary all
          zig build test -Dlinkage=dynamic --summary all
          zig build smoke -Dlinkage=dynamic --summary all

      - name: install the shared delivery
        run: |
          set -euo pipefail
          zig build install -Dlinkage=dynamic \
              --prefix "$RUNNER_TEMP/prefix-shared" --summary all

      - name: the shared objects carry upstream's own ABI numbers
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/prefix-shared"

          # SOEXT_CRYPTO=so.16, SOEXT_X509=so.7, SOEXT_TLS=so.21 at
          # src/library/Makefile:77-79. Matching them is the point: a system
          # library with the same name must be interchangeable at the ABI level,
          # or the number is a lie.
          for pair in libmbedcrypto:16 libmbedx509:7 libmbedtls:21; do
            name=${pair%%:*}
            abi=${pair##*:}
            so="$prefix/lib/$name.so.$abi"
            test -e "$so" || {
              echo "missing $so; upstream's SOEXT for $name is so.$abi" >&2
              ls -l "$prefix/lib" >&2
              exit 1; }
            # The unversioned loader-name symlink, which upstream's own makefile
            # also installs.
            test -e "$prefix/lib/$name.so" || {
              echo "missing the $name.so loader-name link" >&2; exit 1; }
            soname=$(readelf -d "$so" | sed -n 's/.*SONAME\[\(.*\)\].*/\1/p')
            test "$soname" = "$name.so.$abi" || {
              echo "$so has SONAME '$soname', expected $name.so.$abi" >&2
              exit 1; }
            echo "$so with soname $soname, as src/library/Makefile:77-79 states"
          done

          # The export surface is a naming rule, not a list. On ELF the version
          # script marks everything else local, so an internal symbol being
          # absent is itself the assertion. This checks that the rule took
          # effect: a symbol Mbed TLS does not export must not be visible.
          so="$prefix/lib/libmbedtls.so.21"
          for internal in mbedtls_ssl_write_record mbedtls_x509_get_name; do
            if readelf -sW --dyn-syms "$so" | grep -q " $internal\$"; then
              echo "internal symbol $internal is exported; the version script" >&2
              echo "should mark everything outside mbedtls_*/psa_* local" >&2
              exit 1
            fi
          done
          # And the rule did not over-reach: a declared entry point is present.
          for public in mbedtls_ssl_handshake mbedtls_x509_crt_parse; do
            readelf -sW --dyn-syms "$so" | grep -q " $public\$" || {
              echo "declared entry point $public is not exported" >&2; exit 1; }
          done
          echo "the export list is upstream's naming convention, not a catalogue"

          echo "the installed shared tree carries upstream's ABI numbers"

      - name: the installed C surface, through pkg-config, shared delivery
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/prefix-shared"

          export WANT_SHA256_ABC="$(awk '/^sha256_abc /{print $2}' "$RUNNER_TEMP/expected.txt")"
          export WANT_SHA512_ABC="$(awk '/^sha512_abc /{print $2}' "$RUNNER_TEMP/expected.txt")"
          export WANT_HMAC_SHA256_CASE1="$(awk '/^hmac_sha256_case1 /{print $2}' "$RUNNER_TEMP/expected.txt")"
          export WANT_AES128_CBC_BLOCK1="$(awk '/^aes128_cbc_block1 /{print $2}' "$RUNNER_TEMP/expected.txt")"
          export WANT_AES128_GCM_TC2_CT="$(awk '/^aes128_gcm_tc2_ciphertext /{print $2}' "$RUNNER_TEMP/expected.txt")"
          export WANT_AES128_GCM_TC2_TAG="$(awk '/^aes128_gcm_tc2_tag /{print $2}' "$RUNNER_TEMP/expected.txt")"
          export WANT_CHACHA_TAG=fffd3e18018d93709d02e916121b4bc3

          cc -Wall -Wextra -Werror -O2 \
             -o "$RUNNER_TEMP/gate-shared" "$RUNNER_TEMP/mbedtls_gate.c" \
             $(PKG_CONFIG_PATH="$prefix/lib/pkgconfig" pkg-config --cflags mbed-tls) \
             -L"$prefix/lib" -Wl,-rpath,"$prefix/lib" -lmbedtls -lmbedx509 -lmbedcrypto -lm

          "$RUNNER_TEMP/gate-shared" fixtures/test-ca.crt fixtures/server2.crt

  # ---------------------------------------------------------------------------
  # 3. The six compile targets. `zig build check` compiles and runs nothing, so
  #    no test number may be read out of this job either way.
  # ---------------------------------------------------------------------------
  cross:
    name: cross-target compile matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: check x86_64-linux-gnu
        run: zig build check -Dtarget=x86_64-linux-gnu --summary all

      - name: check aarch64-linux-gnu
        run: zig build check -Dtarget=aarch64-linux-gnu --summary all

      - name: check aarch64-macos-none
        run: zig build check -Dtarget=aarch64-macos-none --summary all

      # Windows is where a module definition file states the export list
      # (build.zig:658-667) rather than an ELF version script, so this row also
      # exercises that path. It compiles and links; it does not run.
      - name: check x86_64-windows-gnu
        run: zig build check -Dtarget=x86_64-windows-gnu --summary all

      - name: check riscv64-linux-gnu
        run: zig build check -Dtarget=riscv64-linux-gnu --summary all

      # The sixth target, and the one this build does NOT refuse.
      #
      # `refused_check_targets` is empty and `refusalFor` returns null for every
      # OS (build.zig:440-445), so `wasm32-wasi` is a plain compile here. The
      # one boundary the platform imposes is expressed where it belongs:
      # `zig/config_gen.zig` turns MBEDTLS_NET_C off, so the mbedtls_net_*
      # transport has no symbols, and the three loopback tests in tests.zig --
      # which `check` COMPILES but never runs -- still compile. A successful
      # foreign compile is `build_only`, never a test pass.
      #
      # There is no `|| true` and no `continue-on-error`: if this row fails, the
      # failure is printed and has to be diagnosed and recorded in
      # FORK-NOTES.md, not hidden behind a flag.
      - name: check wasm32-wasi
        run: zig build check -Dtarget=wasm32-wasi --summary all

  # ---------------------------------------------------------------------------
  # 4. The published module, from a package that did not write it, in both
  #    linkages.
  # ---------------------------------------------------------------------------
  consumer:
    name: consumer package, both linkages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Entered directly in consumer/, which is what AGENTS.md section 6 asks
      # for and what `zig build consumer` from the root does not prove on its
      # own: the nested build resolves the dependency by the relative path `..`,
      # so this row is the module contract exercised from outside the package
      # that defines it.
      #
      # The program does a real TLS 1.2 handshake over a real TCP socket between
      # a client and a server in one process, against upstream's own published
      # `test-ca.crt`, `server2.crt` and `server2.key`, and checks every answer
      # against a literal. It binds port 49171 on every interface, because
      # `Socket.bindAll` takes a port and nothing else -- `consumer/src/main.zig`
      # records that limitation rather than hiding it -- so a runner that
      # already has that port bound fails loudly with no silent retry.
      - name: consumer, static delivery
        working-directory: consumer
        run: |
          set -euo pipefail
          zig build run -Dlinkage=static --summary all

      - name: consumer, shared delivery
        working-directory: consumer
        run: |
          set -euo pipefail
          zig build run -Dlinkage=dynamic --summary all

      # The nested route from the repository root, which is a different claim:
      # it proves `zig build consumer` forwards the resolved linkage and target
      # into the nested graph rather than quietly checking the default archives.
      - name: the nested consumer step from the root, both linkages
        run: |
          set -euo pipefail
          zig build consumer -Dlinkage=static --summary all
          zig build consumer -Dlinkage=dynamic --summary all

      # System-library mode is refused at configure time, and this row asserts
      # the refusal rather than assuming it. The panic message names the reason:
      # a system library's headers and struct layouts are not the ones this
      # graph builds.
      - name: system-library mode is refused with its reason
        run: |
          set -uo pipefail
          out=$(zig build -Dsystem=true 2>&1)
          status=$?
          printf '%s\n' "$out" | tail -20
          test "$status" -ne 0 || {
            echo "UNEXPECTED: -Dsystem=true was accepted. This package has no" >&2
            echo "system-library mode and build.zig is supposed to refuse it." >&2
            exit 1; }
          printf '%s\n' "$out" | grep -q 'no system-library mode' || {
            echo "-Dsystem=true failed, but not with the documented refusal:" >&2
            echo "the message does not name system mode, so this is some other" >&2
            echo "configure error" >&2
            exit 1; }
          echo "-Dsystem=true is refused at configure time, as documented"